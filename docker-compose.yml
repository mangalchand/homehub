services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: familyhub
      POSTGRES_PASSWORD: familyhub
      POSTGRES_DB: familyhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
