# Local/self-hosted stack: Postgres + API + worker + web (nginx).
# Usage: cp .env.example .env && set ENCRYPTION_KEY, then `docker compose up --build`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: familyhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familyhub}
      POSTGRES_DB: familyhub
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U familyhub']
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: infra/api.Dockerfile }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://familyhub:${POSTGRES_PASSWORD:-familyhub}@postgres:5432/familyhub
      WORKER_MODE: 'off'
      ENABLE_DEMO_PROVIDER: 'false'
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: infra/api.Dockerfile }
    command: ['node', 'dist/worker.js']
    healthcheck: { disable: true }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://familyhub:${POSTGRES_PASSWORD:-familyhub}@postgres:5432/familyhub
      ENABLE_DEMO_PROVIDER: 'false'
    depends_on: { api: { condition: service_started } }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: infra/web.Dockerfile }
    ports: ['8080:8080']
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
